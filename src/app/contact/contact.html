<p>contact works!</p>

@if(apiData().isLoading) {
  <p>Loading...</p>
} @else {
  <table class="table auto border-collapse border border-gray-400 p-2">
  <tr class="border">
    <th>ID</th>
    <th>Title</th>
    <th>Body</th>
  </tr>
  @for (item of apiData().data; track $index) {
  <tr class="border hover:bg-gray-100 cursor-pointer">
    <td>{{ item.id }}</td>
    <td>{{ item.title }}</td>
    <td>{{ item.body }}</td>
  </tr>
  }
</table>
}
